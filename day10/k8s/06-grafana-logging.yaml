apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-loki
  namespace: day10-logging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    # 1. Loki Log Aggregation Datasource
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: true
      jsonData:
        maxLines: 1000
        # Derived fields: Automatically turn "trace_id" in JSON logs into clickable links to Jaeger traces!
        derivedFields:
          - datasourceUid: jaeger
            matcherRegex: '"trace_id":\s*"([a-fA-F0-9]+)"'
            name: TraceID
            url: '$${__value.raw}'

    # 2. Jaeger Distributed Tracing Datasource
    - name: Jaeger
      uid: jaeger
      type: jaeger
      access: proxy
      url: http://jaeger:16686
      editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-logging
  namespace: day10-logging
  labels:
    app: grafana-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-logging
  template:
    metadata:
      labels:
        app: grafana-logging
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - name: web
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - name: datasource-volume
          mountPath: /etc/grafana/provisioning/datasources
      volumes:
      - name: datasource-volume
        configMap:
          name: grafana-datasources-loki
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-logging
  namespace: day10-logging
  labels:
    app: grafana-logging
spec:
  type: ClusterIP
  selector:
    app: grafana-logging
  ports:
  - name: web
    port: 3000
    targetPort: 3000
