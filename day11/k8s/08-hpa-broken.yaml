apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-autoscaler-broken-hpa
  namespace: day11-autoscaling
  labels:
    app: go-autoscaler-broken
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-autoscaler-broken
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
