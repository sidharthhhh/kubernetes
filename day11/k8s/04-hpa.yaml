apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-autoscaler-hpa
  namespace: day11-autoscaling
  labels:
    app: go-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-autoscaler
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Target: 50% of requested CPU (0.5 * 100m = 50m)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # React to traffic spikes immediately
      policies:
      - type: Percent
        value: 100 # Allow doubling replicas
        periodSeconds: 15
      - type: Pods
        value: 2 # Or add at least 2 pods
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Default is 300s (5m); set to 60s for faster hands-on lab verification
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
      - type: Pods
        value: 1 # Guarantees scale down can reduce by at least 1 pod even from small counts
        periodSeconds: 15
      selectPolicy: Max
