apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-autoscaler-broken
  namespace: day11-autoscaling
  labels:
    app: go-autoscaler-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-autoscaler-broken
  template:
    metadata:
      labels:
        app: go-autoscaler-broken
    spec:
      containers:
      - name: api
        image: k8s-day11:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        # INTENTIONAL BUG FOR DEBUG SCENARIO:
        # Notice that 'requests' are completely omitted!
        # When HPA targets this deployment, it will show:
        # TARGETS: <unknown>/50%
        # Because the HPA controller has no base value to divide actual CPU by!
        limits:
          cpu: 300m
          memory: 128Mi
