apiVersion: v1
kind: Service
metadata:
  name: go-metrics-app
  namespace: day9-monitoring
  labels:
    app: go-metrics-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: go-metrics-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
