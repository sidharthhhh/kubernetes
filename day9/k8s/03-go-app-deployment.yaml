apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-metrics-app
  namespace: day9-monitoring
  labels:
    app: go-metrics-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-metrics-app
  template:
    metadata:
      labels:
        app: go-metrics-app
      annotations:
        # Standard Prometheus discovery annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: k8s-day9:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
