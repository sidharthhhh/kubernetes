apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort-pod
  namespace: day8-resources
  labels:
    app: resource-demo
    qos: besteffort
spec:
  containers:
  - name: demo
    image: k8s-day8:v1
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080
    # NOTE: NO resources.requests and NO resources.limits specified!
    # Kubernetes will classify this Pod as QoS Class: BestEffort.
    # When node memory pressure occurs, BestEffort pods are the FIRST to be killed.
