apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed-pod
  namespace: day8-resources
  labels:
    app: resource-demo
    qos: guaranteed
spec:
  containers:
  - name: demo
    image: k8s-day8:v1
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080
    resources:
      requests:
        cpu: "200m"      # 0.2 vCPU
        memory: "128Mi"  # 128 MiB
      limits:
        cpu: "200m"      # MUST EXACTLY MATCH requests.cpu!
        memory: "128Mi"  # MUST EXACTLY MATCH requests.memory!
    # NOTE: Every container in the pod has CPU and Memory limits & requests defined,
    # and requests == limits for all resources.
    # Kubernetes classifies this Pod as QoS Class: Guaranteed.
    # Guaranteed pods receive highest scheduling priority and are evicted LAST.
